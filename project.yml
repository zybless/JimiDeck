name: JimiDeck
options:
  bundleIdPrefix: com.jimidou
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  JimiDeck:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: CoreAdapter
      - path: Views
      - path: Assets.xcassets
      - path: Core/codex-profile
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimidou.JimiDeck
        PRODUCT_NAME: JimiDeck
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JimiDeck
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 JimiDeck
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - JimiDeckTests
  JimiDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JimiDeckTests
    dependencies:
      - target: JimiDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimidou.JimiDeckTests
        GENERATE_INFOPLIST_FILE: YES
